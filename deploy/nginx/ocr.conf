upstream ocr_backend {
    zone ocr_backend 64k;
    least_conn;
    server ocr-1:8000 max_fails=2 fail_timeout=10s;
    server ocr-2:8000 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 8000;
    server_name _;
    client_max_body_size 30m;

    location = /load-balancer-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # 集群指标必须按实例抓取后聚合，禁止从负载均衡入口随机返回单实例数据。
    location ^~ /metrics {
        return 404;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_pass http://ocr_backend;
    }
}
