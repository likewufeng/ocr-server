name: ocr-server-scale

x-ocr-service: &ocr-service
  image: ocr-server:production
  restart: unless-stopped
  volumes:
    - ./data/uploads:/app/data/uploads
    - ./data/outputs:/app/data/outputs
    - ./data/cache:/app/data/cache
    - ./data/bank_card:/app/data/bank_card:ro
    - ./models:/app/models
    - ./models:/root/.paddlex
  environment: &ocr-environment
    OCR_MODEL_VERSION: ${OCR_MODEL_VERSION:-v6}
    OCR_MODEL_PROFILE: ${OCR_MODEL_PROFILE:-mobile}
    OCR_MODEL_ENGINE: ${OCR_MODEL_ENGINE:-auto}
    OCR_USE_FINE_TUNED_MODEL: "false"
    OCR_DEVICE: cpu
    AUTHORIZATION_RENDER_DPI: ${AUTHORIZATION_RENDER_DPI:-180}
    AUTHORIZATION_NATIVE_TEXT_MIN_CHARS: ${AUTHORIZATION_NATIVE_TEXT_MIN_CHARS:-80}
    AUTHORIZATION_OCR_MIN_SCORE: ${AUTHORIZATION_OCR_MIN_SCORE:-0.35}
    OCR_INFERENCE_BACKEND: ${OCR_INFERENCE_BACKEND:-paddle}
    OCR_ENABLE_MKLDNN: ${OCR_ENABLE_MKLDNN:-true}
    OCR_CPU_THREADS: ${OCR_SCALE_CPU_THREADS:-4}
    OCR_TEXT_RECOGNITION_BATCH_SIZE: ${OCR_TEXT_RECOGNITION_BATCH_SIZE:-6}
    OCR_ID_FRONT_MIN_SCORE: ${OCR_ID_FRONT_MIN_SCORE:-0.5}
    OCR_ID_FRONT_FIELD_ROI_RETRY_ENABLED: ${OCR_ID_FRONT_FIELD_ROI_RETRY_ENABLED:-false}
    OCR_ID_FRONT_FIELD_ROI_SCALE: ${OCR_ID_FRONT_FIELD_ROI_SCALE:-3.0}
    OCR_ID_FRONT_FIELD_ROI_MIN_SCORE: ${OCR_ID_FRONT_FIELD_ROI_MIN_SCORE:-0.5}
    OCR_BUSINESS_SCOPE_ROI_RETRY_ENABLED: ${OCR_BUSINESS_SCOPE_ROI_RETRY_ENABLED:-false}
    OCR_BUSINESS_SCOPE_ROI_MIN_CHARS: ${OCR_BUSINESS_SCOPE_ROI_MIN_CHARS:-48}
    OCR_BUSINESS_SCOPE_ROI_SCALE: ${OCR_BUSINESS_SCOPE_ROI_SCALE:-1.5}
    OCR_BUSINESS_SCOPE_ROI_MAX_SIDE: ${OCR_BUSINESS_SCOPE_ROI_MAX_SIDE:-2200}
    OCR_BUSINESS_SCOPE_ROI_MIN_SCORE: ${OCR_BUSINESS_SCOPE_ROI_MIN_SCORE:-0.5}
    OCR_BUSINESS_FIELD_ROI_RETRY_ENABLED: ${OCR_BUSINESS_FIELD_ROI_RETRY_ENABLED:-false}
    OCR_BUSINESS_FIELD_ROI_SCALE: ${OCR_BUSINESS_FIELD_ROI_SCALE:-3.0}
    OCR_BUSINESS_FIELD_ROI_MIN_SCORE: ${OCR_BUSINESS_FIELD_ROI_MIN_SCORE:-0.5}
    OCR_BUSINESS_LICENSE_DETECTION_SIDE_LIMIT: ${OCR_BUSINESS_LICENSE_DETECTION_SIDE_LIMIT:-960}
    OCR_ID_FRONT_QUALITY_RETRY_ENABLED: ${OCR_ID_FRONT_QUALITY_RETRY_ENABLED:-false}
    OCR_ID_FRONT_RETRY_ON_INCOMPLETE: ${OCR_ID_FRONT_RETRY_ON_INCOMPLETE:-true}
    OCR_ID_FRONT_RETRY_SCALE: ${OCR_ID_FRONT_RETRY_SCALE:-1.5}
    OCR_ID_FRONT_RETRY_MAX_SIDE: ${OCR_ID_FRONT_RETRY_MAX_SIDE:-2400}
    OCR_ID_FRONT_RETRY_BLUR_THRESHOLD: ${OCR_ID_FRONT_RETRY_BLUR_THRESHOLD:-45}
    OCR_ID_FRONT_RETRY_MIN_SIDE: ${OCR_ID_FRONT_RETRY_MIN_SIDE:-300}
    OCR_ID_FRONT_RETRY_DARK_MEAN: ${OCR_ID_FRONT_RETRY_DARK_MEAN:-35}
    OCR_ID_FRONT_RETRY_BRIGHT_MEAN: ${OCR_ID_FRONT_RETRY_BRIGHT_MEAN:-235}
    OCR_ID_FRONT_RETRY_CLIPPED_RATIO: ${OCR_ID_FRONT_RETRY_CLIPPED_RATIO:-0.35}
    OCR_MAX_CONCURRENT_REQUESTS: 1
    OCR_ENABLE_DOC_ORIENTATION_MODEL: ${OCR_ENABLE_DOC_ORIENTATION_MODEL:-true}
    OCR_USE_DOC_ORIENTATION: ${OCR_USE_DOC_ORIENTATION:-true}
    OCR_ID_FRONT_USE_DOC_UNWARPING: ${OCR_ID_FRONT_USE_DOC_UNWARPING:-false}
    OCR_SAVE_PREPROCESSED_IMAGE: ${OCR_SAVE_PREPROCESSED_IMAGE:-true}
    OCR_CACHE_ENABLED: ${OCR_CACHE_ENABLED:-true}
    BANK_CARD_CATALOG_FILE: ${BANK_CARD_CATALOG_FILE:-app/resources/bank_card/catalog.json}
    BANK_CARD_IIN_FILE: ${BANK_CARD_IIN_FILE:-app/resources/bank_card/iin_catalog.json}
    METRICS_ENABLED: ${METRICS_ENABLED:-true}
    OMP_NUM_THREADS: ${OCR_SCALE_CPU_THREADS:-4}
    MKL_NUM_THREADS: ${OCR_SCALE_CPU_THREADS:-4}
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  healthcheck:
    test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8000/health"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 180s

services:
  ocr-1:
    <<: *ocr-service
    build: .
    container_name: ocr-server-1
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/outputs:/app/data/outputs
      - ./data/cache:/app/data/cache
      - ./data/bank_card:/app/data/bank_card:ro
      - ./models:/app/models
      - ./models:/root/.paddlex
      - ./data/logs/ocr-1:/app/data/logs/ocr-1
    environment:
      <<: *ocr-environment
      INSTANCE_NAME: ocr-1
      LOG_DIR: data/logs/ocr-1

  ocr-2:
    <<: *ocr-service
    container_name: ocr-server-2
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/outputs:/app/data/outputs
      - ./data/cache:/app/data/cache
      - ./data/bank_card:/app/data/bank_card:ro
      - ./models:/app/models
      - ./models:/root/.paddlex
      - ./data/logs/ocr-2:/app/data/logs/ocr-2
    environment:
      <<: *ocr-environment
      INSTANCE_NAME: ocr-2
      LOG_DIR: data/logs/ocr-2

  nginx:
    image: nginx:1.27-alpine
    container_name: ocr-nginx
    restart: unless-stopped
    ports:
      - "${OCR_HOST_PORT:-18081}:8000"
    volumes:
      - ./deploy/nginx/ocr.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ocr-1:
        condition: service_healthy
      ocr-2:
        condition: service_healthy
