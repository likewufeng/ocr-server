services:

  paddle-ocr:

    build: .
    
    container_name: paddle-ocr-server

    ports:
      - "8000:8000"

    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/outputs:/app/data/outputs
      - ./data/cache:/app/data/cache
      - ./models:/app/models
      - ./models:/root/.paddlex
      - ./data/logs:/app/data/logs

    environment:
      OCR_MODEL_PROFILE: ${OCR_MODEL_PROFILE:-mobile}
      OCR_DEVICE: cpu
      OCR_ENABLE_MKLDNN: ${OCR_ENABLE_MKLDNN:-true}
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-8}
      OCR_TEXT_RECOGNITION_BATCH_SIZE: ${OCR_TEXT_RECOGNITION_BATCH_SIZE:-6}
      OCR_ENABLE_DOC_ORIENTATION_MODEL: ${OCR_ENABLE_DOC_ORIENTATION_MODEL:-true}
      OCR_USE_DOC_ORIENTATION: ${OCR_USE_DOC_ORIENTATION:-true}
      OCR_SAVE_PREPROCESSED_IMAGE: ${OCR_SAVE_PREPROCESSED_IMAGE:-true}
      OCR_CACHE_ENABLED: ${OCR_CACHE_ENABLED:-true}
      OMP_NUM_THREADS: ${OCR_CPU_THREADS:-8}
      MKL_NUM_THREADS: ${OCR_CPU_THREADS:-8}

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

    restart: unless-stopped
