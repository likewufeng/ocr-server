name: ocr-openvino-experiment

x-experiment-service: &experiment-service
  restart: unless-stopped
  volumes:
    - ./data/openvino-experiment/uploads:/app/data/uploads
    - ./data/openvino-experiment/outputs:/app/data/outputs
    - ./data/openvino-experiment/cache:/app/data/cache
    - ./data/bank_card:/app/data/bank_card:ro
    - ./models:/app/models:ro
  environment: &experiment-environment
    OCR_MODEL_VERSION: ${OCR_MODEL_VERSION:-v6}
    OCR_MODEL_PROFILE: ${OCR_MODEL_PROFILE:-mobile}
    OCR_MODEL_ENGINE: ${OCR_MODEL_ENGINE:-auto}
    OCR_DEVICE: cpu
    OCR_USE_FINE_TUNED_MODEL: "false"
    OCR_ENABLE_MKLDNN: "true"
    OCR_CPU_THREADS: ${OCR_CPU_THREADS:-8}
    OCR_TEXT_RECOGNITION_BATCH_SIZE: ${OCR_TEXT_RECOGNITION_BATCH_SIZE:-6}
    OCR_ID_FRONT_FIELD_ROI_RETRY_ENABLED: ${OCR_ID_FRONT_FIELD_ROI_RETRY_ENABLED:-false}
    OCR_ID_FRONT_FIELD_ROI_SCALE: ${OCR_ID_FRONT_FIELD_ROI_SCALE:-3.0}
    OCR_ID_FRONT_FIELD_ROI_MIN_SCORE: ${OCR_ID_FRONT_FIELD_ROI_MIN_SCORE:-0.5}
    OCR_BUSINESS_SCOPE_ROI_RETRY_ENABLED: ${OCR_BUSINESS_SCOPE_ROI_RETRY_ENABLED:-false}
    OCR_BUSINESS_SCOPE_ROI_MIN_CHARS: ${OCR_BUSINESS_SCOPE_ROI_MIN_CHARS:-48}
    OCR_BUSINESS_SCOPE_ROI_SCALE: ${OCR_BUSINESS_SCOPE_ROI_SCALE:-1.5}
    OCR_BUSINESS_SCOPE_ROI_MAX_SIDE: ${OCR_BUSINESS_SCOPE_ROI_MAX_SIDE:-2200}
    OCR_BUSINESS_SCOPE_ROI_MIN_SCORE: ${OCR_BUSINESS_SCOPE_ROI_MIN_SCORE:-0.5}
    OCR_BUSINESS_LICENSE_DETECTION_SIDE_LIMIT: ${OCR_BUSINESS_LICENSE_DETECTION_SIDE_LIMIT:-960}
    OCR_MAX_CONCURRENT_REQUESTS: 1
    OCR_ID_FRONT_QUALITY_RETRY_ENABLED: ${OCR_ID_FRONT_QUALITY_RETRY_ENABLED:-false}
    OCR_ID_FRONT_RETRY_ON_INCOMPLETE: ${OCR_ID_FRONT_RETRY_ON_INCOMPLETE:-true}
    OCR_ID_FRONT_RETRY_SCALE: ${OCR_ID_FRONT_RETRY_SCALE:-1.5}
    OCR_ID_FRONT_RETRY_MAX_SIDE: ${OCR_ID_FRONT_RETRY_MAX_SIDE:-2400}
    OCR_ID_FRONT_RETRY_BLUR_THRESHOLD: ${OCR_ID_FRONT_RETRY_BLUR_THRESHOLD:-45}
    OCR_ID_FRONT_RETRY_MIN_SIDE: ${OCR_ID_FRONT_RETRY_MIN_SIDE:-300}
    OCR_ID_FRONT_RETRY_DARK_MEAN: ${OCR_ID_FRONT_RETRY_DARK_MEAN:-35}
    OCR_ID_FRONT_RETRY_BRIGHT_MEAN: ${OCR_ID_FRONT_RETRY_BRIGHT_MEAN:-235}
    OCR_ID_FRONT_RETRY_CLIPPED_RATIO: ${OCR_ID_FRONT_RETRY_CLIPPED_RATIO:-0.35}
    OCR_ENABLE_DOC_ORIENTATION_MODEL: ${OCR_ENABLE_DOC_ORIENTATION_MODEL:-true}
    OCR_USE_DOC_ORIENTATION: ${OCR_USE_DOC_ORIENTATION:-true}
    OCR_ID_FRONT_USE_DOC_UNWARPING: ${OCR_ID_FRONT_USE_DOC_UNWARPING:-false}
    OCR_SAVE_PREPROCESSED_IMAGE: "false"
    OCR_CACHE_ENABLED: "false"
    BANK_CARD_CATALOG_FILE: ${BANK_CARD_CATALOG_FILE:-app/resources/bank_card/catalog.json}
    BANK_CARD_IIN_FILE: ${BANK_CARD_IIN_FILE:-app/resources/bank_card/iin_catalog.json}
    METRICS_ENABLED: "true"
    OMP_NUM_THREADS: ${OCR_CPU_THREADS:-8}
    MKL_NUM_THREADS: ${OCR_CPU_THREADS:-8}
  command: >-
    sh -c 'if [ ! -d /root/.paddlex/official_models ]; then
    cp -a /app/models/. /root/.paddlex/; fi;
    exec uvicorn app.main:app --host 0.0.0.0 --port 8000'

services:
  paddle-baseline:
    <<: *experiment-service
    build:
      context: .
      args:
        INSTALL_OPENVINO: "false"
    container_name: ocr-paddle-baseline
    ports:
      - "127.0.0.1:8011:8000"
    volumes:
      - ./data/openvino-experiment/uploads:/app/data/uploads
      - ./data/openvino-experiment/outputs:/app/data/outputs
      - ./data/openvino-experiment/cache:/app/data/cache
      - ./data/bank_card:/app/data/bank_card:ro
      - ./models:/app/models:ro
      - paddle-experiment-models:/root/.paddlex
      - ./data/openvino-experiment/logs/paddle:/app/data/logs/paddle
    environment:
      <<: *experiment-environment
      INSTANCE_NAME: paddle-baseline
      LOG_DIR: data/logs/paddle
      OCR_INFERENCE_BACKEND: paddle

  openvino:
    <<: *experiment-service
    build:
      context: .
      args:
        INSTALL_OPENVINO: "true"
    container_name: ocr-openvino
    ports:
      - "127.0.0.1:8012:8000"
    volumes:
      - ./data/openvino-experiment/uploads:/app/data/uploads
      - ./data/openvino-experiment/outputs:/app/data/outputs
      - ./data/openvino-experiment/cache:/app/data/cache
      - ./data/bank_card:/app/data/bank_card:ro
      - ./models:/app/models:ro
      - openvino-experiment-models:/root/.paddlex
      - ./data/openvino-experiment/logs/openvino:/app/data/logs/openvino
    environment:
      <<: *experiment-environment
      INSTANCE_NAME: openvino
      LOG_DIR: data/logs/openvino
      OCR_INFERENCE_BACKEND: openvino

volumes:
  paddle-experiment-models:
  openvino-experiment-models:
